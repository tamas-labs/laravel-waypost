name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The tests on both supported databases, and with the lowest dependencies composer.json allows (there is no
  # composer.lock: a host gets whatever versions fit). PHPStan, the type coverage and Pint once, on the usual setup.
  check:
    name: tests (${{ matrix.db }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { db: mysql, dependencies: stable, port: 3306 }
          - { db: pgsql, dependencies: stable, port: 5432 }
          - { db: mysql, dependencies: lowest, port: 3306 }
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: waypost_test
          MYSQL_USER: waypost
          MYSQL_PASSWORD: waypost
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uwaypost -pwaypost"
          --health-interval 2s --health-timeout 5s --health-retries 30
      pgsql:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: waypost_test
          POSTGRES_USER: waypost
          POSTGRES_PASSWORD: waypost
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U waypost -d waypost_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: laravel-waypost
    steps:
      - uses: actions/checkout@v7
        with:
          path: laravel-waypost
      - name: Read the schema version
        id: schema
        run: echo "tag=$(cat .waypost-schema-version)" >> "$GITHUB_OUTPUT"
      # waypost/schema comes from the path repository ../waypost-schema, so the schema goes next to it, at the pinned tag.
      - uses: actions/checkout@v7
        with:
          repository: tamas-labs/waypost-schema
          ref: ${{ steps.schema.outputs.tag }}
          path: waypost-schema
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, fileinfo, gd, intl, pcntl, pdo_mysql, pdo_pgsql, zip
          coverage: none
      - if: matrix.dependencies == 'stable'
        run: composer install --no-interaction --no-progress
      - if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
      - run: composer test
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
      - if: matrix.db == 'mysql' && matrix.dependencies == 'stable'
        run: composer analyse
      - if: matrix.db == 'mysql' && matrix.dependencies == 'stable'
        run: composer test:types
      - if: matrix.db == 'mysql' && matrix.dependencies == 'stable'
        run: composer lint

  # The package in a fresh Laravel 13 application, as a host installs it (scripts/install-smoke.sh): the host's own
  # exception handler and HTTP kernel, which the Testbench tests do not have.
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: laravel-waypost
    steps:
      - uses: actions/checkout@v7
        with:
          path: laravel-waypost
      - name: Read the schema version
        id: schema
        run: echo "tag=$(cat .waypost-schema-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: tamas-labs/waypost-schema
          ref: ${{ steps.schema.outputs.tag }}
          path: waypost-schema
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, fileinfo, gd, intl, pdo_sqlite, zip
          coverage: none
      - run: sh scripts/install-smoke.sh
